services:

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wpp-server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/db/wpp.db
      WA_SESSION_PATH: /data/wa-session
      MEDIA_PATH: /data/media
    volumes:
      - wa_session:/data/wa-session
      - db_data:/data/db
      - media_data:/data/media
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: wpp-ui
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:5173:80"

  nginx:
    image: nginx:alpine
    container_name: wpp-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "0.0.0.0:80:80"
    depends_on:
      - server
      - ui

volumes:
  wa_session:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/wa-session
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/db
  media_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/media
