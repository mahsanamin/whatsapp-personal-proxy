services:

  server:
    build:
      # Repo root so the `wpp` CLI is bundled into the image and can be
      # downloaded by other machines from /api/cli/wpp.
      context: .
      dockerfile: server/Dockerfile
    container_name: wpp-server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3901
      DB_PATH: /data/db/wpp.db
      WA_SESSION_PATH: /data/wa-session
      MEDIA_PATH: /data/media
    volumes:
      - wa_session:/data/wa-session
      - db_data:/data/db
      - media_data:/data/media
    # Not published: nginx reaches the server over the compose network. Exposing
    # it on the host would bypass the edge proxy and clash with anything else
    # already on 3901.
    expose:
      - "3901"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3901/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: wpp-ui
    restart: unless-stopped
    depends_on:
      - server
    expose:
      - "5973"

  nginx:
    image: nginx:alpine
    container_name: wpp-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # BIND_HOST defaults to 127.0.0.1 in .env.example so the UI is only
      # reachable through your fronting reverse proxy / Tailscale. Set it to
      # 0.0.0.0 only if you intentionally want LAN access without a TLS hop.
      - "${BIND_HOST:-127.0.0.1}:3900:80"
    depends_on:
      - server
      - ui

volumes:
  wa_session:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/wa-session
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/db
  media_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/media
