name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:00 UTC so freshly-disclosed CVEs in
    # transitive deps surface even when no commits have landed.
    - cron: '0 6 * * 1'

jobs:
  server:
    name: Server (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: cd server && npm ci
      - run: cd server && npm audit --audit-level=high

  ui:
    name: UI (npm audit + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci
      - run: cd ui && npm audit --audit-level=high
      - run: cd ui && npm run build

  tests:
    name: Tests (server + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Server unit tests
        run: cd server && npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      # 3.9 is the floor the CLI promises; run the suite on it so a newer
      # syntax slip cannot ship to a machine with an older Python.
      - name: CLI compiles and passes its tests
        run: |
          python3 -m py_compile wpp
          python3 -m unittest discover -s tests/cli -t .

  docker:
    name: Docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stub .env so config validation doesn't abort the build
        run: |
          cat > .env <<'EOF'
          ADMIN_USER=admin
          ADMIN_PASS=ci-build-only-not-a-real-password
          JWT_SECRET=ci_build_only_secret_not_real_must_be_thirty_two_chars_min
          PERSONAL_NUMBERS=+15555550100
          PUBLIC_URL=http://localhost:3300
          EOF
      - name: Build all images
        run: docker compose build
