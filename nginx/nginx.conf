worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Combined, minus the query string. /ws accepts ?token= because a browser
  # cannot set headers on a WebSocket handshake, and the default $request would
  # write that token straight into the access log.
  log_format wpp '$remote_addr - $remote_user [$time_local] '
                 '"$request_method $uri $server_protocol" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log wpp;

  upstream server { server server:3901; }
  upstream ui     { server ui:5973; }

  # Forwarded headers — propagate the original client IP and scheme so the
  # Node app's trustProxy can set request.ip / request.protocol correctly,
  # and so secure-cookie checks work when an HTTPS proxy (host nginx,
  # Tailscale Serve, Cloudflare, etc.) sits in front of this stack.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-Host  $http_x_forwarded_host;

  server {
    listen 80;

    # API
    location /api/ {
      proxy_pass http://server/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Fetching media WhatsApp has dropped means asking the phone to re-upload,
      # which routinely takes longer than the 60s default and returned 504.
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      # Media can be large; buffering it to disk first only adds latency.
      proxy_buffering off;
      client_max_body_size 100m;
    }

    # WebSocket
    location /ws {
      proxy_pass http://server/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    # Web UI (everything else)
    location / {
      proxy_pass http://ui/;
    }
  }
}
