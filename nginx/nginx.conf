worker_processes 1;

events {
  worker_connections 1024;
}

http {
  upstream server { server server:3000; }
  upstream ui     { server ui:5173; }

  # Forwarded headers — propagate the original client IP and scheme so the
  # Node app's trustProxy can set request.ip / request.protocol correctly,
  # and so secure-cookie checks work when an HTTPS proxy (host nginx,
  # Tailscale Serve, Cloudflare, etc.) sits in front of this stack.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-Host  $http_x_forwarded_host;

  server {
    listen 80;

    # API
    location /api/ {
      proxy_pass http://server/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # WebSocket
    location /ws {
      proxy_pass http://server/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    # Web UI (everything else)
    location / {
      proxy_pass http://ui/;
    }
  }
}
